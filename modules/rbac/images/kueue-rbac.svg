<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="clusterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="editGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="adminBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="userBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
    <linearGradient id="editBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#e65100"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="32" font-weight="bold" fill="#202124">Kueue RBAC Bindings</text>
  <text x="550" y="70" text-anchor="middle" font-size="20" fill="#5f6368">How admin and user roles are bound at cluster and namespace scope</text>

  <!-- Cluster outer border -->
  <rect x="30" y="95" width="1040" height="610" rx="16" fill="url(#clusterGrad)" stroke="#616161" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#424242">Cluster</text>

  <!-- ========== ROW 1: ClusterRoleBinding (admin) ========== -->
  <rect x="60" y="155" width="980" height="170" rx="12" fill="url(#adminGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>

  <!-- Scope badge -->
  <rect x="80" y="168" width="210" height="32" rx="8" fill="url(#adminBadge)" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="185" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ClusterRoleBinding</text>

  <!-- User badge -->
  <rect x="80" y="215" width="160" height="42" rx="8" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="242" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">admin</text>

  <!-- Arrow -->
  <line x1="250" y1="236" x2="310" y2="236" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Role badge -->
  <rect x="320" y="215" width="340" height="42" rx="8" fill="url(#adminBadge)" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="490" y="242" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">kueue-batch-admin-role</text>

  <!-- Permissions -->
  <text x="80" y="287" font-size="17" font-weight="bold" fill="#0d47a1">Can manage:</text>
  <text x="220" y="287" font-size="17" fill="#37474f">ClusterQueues, ResourceFlavors, WorkloadPriorityClasses, LocalQueues, Workloads, Jobs</text>
  <text x="80" y="312" font-size="17" font-weight="bold" fill="#0d47a1">Scope:</text>
  <text x="150" y="312" font-size="17" fill="#37474f">cluster-wide (all namespaces)</text>

  <!-- ========== ROW 2: RoleBinding (user) ========== -->
  <rect x="60" y="345" width="980" height="170" rx="12" fill="url(#userGrad)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>

  <!-- Scope badge -->
  <rect x="80" y="358" width="370" height="32" rx="8" fill="url(#userBadge)" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="265" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">RoleBinding (namespace: training-jobs)</text>

  <!-- User badge -->
  <rect x="80" y="405" width="150" height="42" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="155" y="432" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">user1</text>

  <!-- Arrow -->
  <line x1="240" y1="426" x2="300" y2="426" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Role badge -->
  <rect x="310" y="405" width="330" height="42" rx="8" fill="url(#userBadge)" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="475" y="432" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">kueue-batch-user-role</text>

  <!-- Permissions -->
  <text x="80" y="477" font-size="17" font-weight="bold" fill="#1b5e20">Can:</text>
  <text x="125" y="477" font-size="17" fill="#37474f">submit Jobs, view LocalQueues and Workloads (namespace-scoped only)</text>
  <text x="80" y="502" font-size="17" font-weight="bold" fill="#c62828">Cannot:</text>
  <text x="160" y="502" font-size="17" fill="#37474f">view ClusterQueues, create/modify/delete LocalQueues or other Kueue infrastructure</text>

  <!-- ========== ROW 3: RoleBinding (edit role) ========== -->
  <rect x="60" y="535" width="980" height="150" rx="12" fill="url(#editGrad)" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>

  <!-- Scope badge -->
  <rect x="80" y="548" width="370" height="32" rx="8" fill="url(#editBadge)" stroke="#bf360c" stroke-width="1.5"/>
  <text x="265" y="570" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">RoleBinding (namespace: training-jobs)</text>

  <!-- User badge -->
  <rect x="80" y="595" width="160" height="42" rx="8" fill="#fff" stroke="#e65100" stroke-width="1.5"/>
  <text x="160" y="622" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">Both users</text>

  <!-- Arrow -->
  <line x1="250" y1="616" x2="310" y2="616" stroke="#e65100" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <!-- Role badge -->
  <rect x="320" y="595" width="250" height="42" rx="8" fill="url(#editBadge)" stroke="#bf360c" stroke-width="1.5"/>
  <text x="445" y="622" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">edit ClusterRole</text>

  <!-- Permissions -->
  <text x="600" y="612" font-size="17" font-weight="bold" fill="#e65100">Adds:</text>
  <text x="655" y="612" font-size="17" fill="#37474f">pod, log, event, configmap access</text>
  <text x="600" y="638" font-size="16" font-style="italic" fill="#757575">(Kueue roles don't cover these)</text>
</svg>
