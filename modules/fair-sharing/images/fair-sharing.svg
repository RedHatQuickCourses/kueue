<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="cqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="lqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="flavorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#c6dafc"/>
    </linearGradient>
    <linearGradient id="drsHighGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="100%" stop-color="#ffcdd2"/>
    </linearGradient>
    <linearGradient id="drsLowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="28" font-weight="bold" fill="#202124">DRS Fair Sharing</text>
  <text x="550" y="66" text-anchor="middle" font-size="18" fill="#5f6368">Kueue preempts the queue with the highest Dominant Resource Share (DRS)</text>

  <!-- ==================== Cohort boundary ==================== -->
  <rect x="60" y="90" width="980" height="640" rx="16" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="550" y="118" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Cohort: fair-sharing-cohort</text>
  <text x="550" y="142" text-anchor="middle" font-size="16" fill="#1976d2">preemptionPolicy: FairSharing (Kueue CR)</text>

  <!-- ==================== Left side: team-a-cluster-queue ==================== -->

  <!-- ClusterQueue -->
  <rect x="100" y="165" width="400" height="150" rx="10" fill="url(#cqGrad)" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">team-a-cluster-queue</text>
  <text x="300" y="221" text-anchor="middle" font-size="16" fill="#33691e">Quota: 2 GPUs (A100)</text>
  <text x="300" y="245" text-anchor="middle" font-size="15" fill="#558b2f">fairSharing.weight: 1</text>
  <text x="300" y="269" text-anchor="middle" font-size="15" fill="#558b2f">reclaimWithinCohort: Any</text>
  <text x="300" y="293" text-anchor="middle" font-size="14" fill="#689f38">Role: research / training</text>

  <!-- Flavor box -->
  <rect x="140" y="325" width="320" height="50" rx="8" fill="url(#flavorGrad)" stroke="#ef6c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="349" text-anchor="middle" font-size="18" font-weight="bold" fill="#bf360c">Flavor: a100-gpu</text>
  <text x="300" y="367" text-anchor="middle" font-size="14" fill="#4e342e">nodeLabel: NVIDIA-A100-SXM4-40GB</text>

  <!-- ==================== Right side: team-b-cluster-queue ==================== -->

  <!-- ClusterQueue -->
  <rect x="600" y="165" width="400" height="150" rx="10" fill="url(#cqGrad)" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">team-b-cluster-queue</text>
  <text x="800" y="221" text-anchor="middle" font-size="16" fill="#33691e">Quota: 1 GPU (A100)</text>
  <text x="800" y="245" text-anchor="middle" font-size="15" fill="#558b2f">fairSharing.weight: 2</text>
  <text x="800" y="269" text-anchor="middle" font-size="15" fill="#558b2f">reclaimWithinCohort: Any</text>
  <text x="800" y="293" text-anchor="middle" font-size="14" fill="#689f38">Role: production / inference</text>

  <!-- Flavor box -->
  <rect x="640" y="325" width="320" height="50" rx="8" fill="url(#flavorGrad)" stroke="#ef6c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="349" text-anchor="middle" font-size="18" font-weight="bold" fill="#bf360c">Flavor: a100-gpu</text>
  <text x="800" y="367" text-anchor="middle" font-size="14" fill="#4e342e">nodeLabel: NVIDIA-A100-SXM4-40GB</text>

  <!-- ==================== Borrowing arrow ==================== -->
  <path d="M 500 240 C 530 240, 540 240, 570 240" stroke="#e65100" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <text x="548" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">borrows 1 GPU</text>

  <!-- ==================== DRS Score boxes ==================== -->

  <!-- DRS high (Team A) -->
  <rect x="140" y="390" width="150" height="50" rx="8" fill="url(#drsHighGrad)" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">DRS = 1000</text>
  <text x="215" y="432" text-anchor="middle" font-size="13" fill="#c62828">borrowing heavily</text>

  <!-- DRS formula (Team A) -->
  <rect x="310" y="390" width="150" height="50" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="1" filter="url(#shadow)"/>
  <text x="385" y="412" text-anchor="middle" font-size="12" fill="#616161">(1/1) &#xD7; 1000 / 1</text>
  <text x="385" y="430" text-anchor="middle" font-size="11" fill="#757575">borrow/lendable/weight</text>

  <!-- DRS low (Team B) -->
  <rect x="710" y="390" width="150" height="50" rx="8" fill="url(#drsLowGrad)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">DRS = 0</text>
  <text x="785" y="432" text-anchor="middle" font-size="13" fill="#2e7d32">at or below quota</text>

  <!-- ==================== Preemption arrow (curves below DRS boxes) ==================== -->
  <path d="M 700 440 C 620 480, 480 480, 300 440" stroke="#c62828" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="510" y="478" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">Kueue preempts highest DRS</text>

  <!-- ==================== LocalQueues ==================== -->

  <!-- Arrow: CQ left -> LQ left -->
  <line x1="300" y1="375" x2="300" y2="505" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: CQ right -> LQ right -->
  <line x1="800" y1="375" x2="800" y2="505" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- team-a-queue -->
  <rect x="140" y="510" width="320" height="55" rx="8" fill="url(#lqGrad)" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="537" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">team-a-queue</text>
  <text x="300" y="557" text-anchor="middle" font-size="15" fill="#6a1b9a">ns: training-jobs</text>

  <!-- team-b-queue -->
  <rect x="640" y="510" width="320" height="55" rx="8" fill="url(#lqGrad)" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="537" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">team-b-queue</text>
  <text x="800" y="557" text-anchor="middle" font-size="15" fill="#6a1b9a">ns: team-b-jobs</text>

  <!-- ==================== Worker Node ==================== -->

  <!-- Arrow: LQ left -> Node -->
  <line x1="300" y1="565" x2="450" y2="620" stroke="#5f6368" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Arrow: LQ right -> Node -->
  <line x1="800" y1="565" x2="650" y2="620" stroke="#5f6368" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Shared Worker Node -->
  <rect x="300" y="625" width="500" height="80" rx="8" fill="url(#nodeGrad)" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="655" text-anchor="middle" font-size="19" font-weight="600" fill="#1a237e">Worker Node 1</text>
  <text x="550" y="679" text-anchor="middle" font-size="16" fill="#3c4043">3&#xD7; NVIDIA A100-SXM4-40GB (shared by both teams)</text>

  <!-- ==================== Legend ==================== -->
  <rect x="100" y="715" width="16" height="16" rx="3" fill="url(#drsHighGrad)" stroke="#c62828" stroke-width="1.5"/>
  <text x="122" y="728" font-size="14" fill="#424242">High DRS (preemption target)</text>

  <rect x="340" y="715" width="16" height="16" rx="3" fill="url(#drsLowGrad)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="362" y="728" font-size="14" fill="#424242">Low DRS (safe from preemption)</text>

  <line x1="610" y1="723" x2="650" y2="723" stroke="#e65100" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="658" y="728" font-size="14" fill="#424242">Borrowing</text>

  <line x1="760" y1="723" x2="800" y2="723" stroke="#c62828" stroke-width="3"/>
  <text x="808" y="728" font-size="14" fill="#424242">Preemption</text>
</svg>
