<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="cpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d2e3fc"/>
    </linearGradient>
    <linearGradient id="w1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f9d0cc"/>
    </linearGradient>
    <linearGradient id="w2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#ceead6"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="svcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e8d5f5"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#202124">OpenShift Cluster Topology</text>
  <text x="550" y="58" text-anchor="middle" font-size="16" fill="#5f6368">OCP 4.20 &#x2022; 5 nodes &#x2022; Fake GPU Operator</text>

  <!-- Cluster border -->
  <rect x="20" y="75" width="1060" height="650" rx="14" fill="none" stroke="#dadce0" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="42" y="98" font-size="14" fill="#80868b" font-weight="bold">OPENSHIFT CLUSTER</text>

  <!-- Control Plane Node 1 -->
  <rect x="40" y="115" width="320" height="110" rx="10" fill="url(#cpGrad)" stroke="#4285f4" stroke-width="1.5"/>
  <text x="65" y="140" font-weight="bold" font-size="16" fill="#1a73e8">control-plane-1</text>
  <text x="65" y="162" font-size="14" fill="#5f6368">16 vCPU &#x2022; 64 GiB RAM &#x2022; 100 GiB</text>
  <text x="65" y="181" font-size="13" fill="#5f6368">Roles: control-plane, master, worker</text>
  <text x="65" y="200" font-size="13" fill="#5f6368">x86_64 &#x2022; RHCOS 9.6</text>

  <!-- Control Plane Node 2 -->
  <rect x="380" y="115" width="320" height="110" rx="10" fill="url(#cpGrad)" stroke="#4285f4" stroke-width="1.5"/>
  <text x="405" y="140" font-weight="bold" font-size="16" fill="#1a73e8">control-plane-2</text>
  <text x="405" y="162" font-size="14" fill="#5f6368">16 vCPU &#x2022; 64 GiB RAM &#x2022; 100 GiB</text>
  <text x="405" y="181" font-size="13" fill="#5f6368">Roles: control-plane, master, worker</text>
  <text x="405" y="200" font-size="13" fill="#5f6368">x86_64 &#x2022; RHCOS 9.6</text>

  <!-- Control Plane Node 3 -->
  <rect x="720" y="115" width="320" height="110" rx="10" fill="url(#cpGrad)" stroke="#4285f4" stroke-width="1.5"/>
  <text x="745" y="140" font-weight="bold" font-size="16" fill="#1a73e8">control-plane-3</text>
  <text x="745" y="162" font-size="14" fill="#5f6368">16 vCPU &#x2022; 64 GiB RAM &#x2022; 100 GiB</text>
  <text x="745" y="181" font-size="13" fill="#5f6368">Roles: control-plane, master, worker</text>
  <text x="745" y="200" font-size="13" fill="#5f6368">x86_64 &#x2022; RHCOS 9.6</text>

  <!-- Infrastructure services bar -->
  <rect x="40" y="240" width="1000" height="52" rx="8" fill="url(#svcGrad)" stroke="#7c4dff" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="55" y="260" font-size="13" font-weight="bold" fill="#6200ea">Infrastructure services (distributed across control-plane nodes)</text>
  <text x="55" y="280" font-size="14" fill="#4a148c">API Server  &#x2022;  etcd  &#x2022;  OAuth / Keycloak  &#x2022;  ODF / Ceph CSI  &#x2022;  Ingress  &#x2022;  Monitoring  &#x2022;  OLM</text>

  <!-- Worker 1 -->
  <rect x="40" y="310" width="510" height="395" rx="10" fill="url(#w1Grad)" stroke="#d93025" stroke-width="1.5"/>
  <text x="65" y="340" font-weight="bold" font-size="17" fill="#c5221f">worker-1 (A100 Pool)</text>
  <text x="65" y="362" font-size="14" fill="#5f6368">16 vCPU &#x2022; 64 GiB RAM &#x2022; 100 GiB disk &#x2022; RHCOS 9.6</text>
  <text x="65" y="384" font-size="14" fill="#5f6368">Label: run.ai/simulated-gpu-node-pool=a100-pool</text>
  <text x="65" y="406" font-size="14" fill="#5f6368">Taint: nvidia.com/gpu=present:NoSchedule</text>

  <!-- A100 GPUs -->
  <text x="65" y="436" font-size="15" font-weight="bold" fill="#e65100">4x NVIDIA A100-SXM4-40GB (fake)</text>

  <rect x="65" y="450" width="110" height="68" rx="6" fill="url(#gpuGrad)" stroke="#e65100" stroke-width="1.2"/>
  <text x="120" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">GPU 0</text>
  <text x="120" y="495" text-anchor="middle" font-size="13" fill="#bf360c">40 GiB</text>
  <text x="120" y="511" text-anchor="middle" font-size="11" fill="#bf360c">MIG capable</text>

  <rect x="187" y="450" width="100" height="68" rx="6" fill="url(#gpuGrad)" stroke="#e65100" stroke-width="1.2"/>
  <text x="237" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">GPU 1</text>
  <text x="237" y="495" text-anchor="middle" font-size="13" fill="#bf360c">40 GiB</text>

  <rect x="299" y="450" width="100" height="68" rx="6" fill="url(#gpuGrad)" stroke="#e65100" stroke-width="1.2"/>
  <text x="349" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">GPU 2</text>
  <text x="349" y="495" text-anchor="middle" font-size="13" fill="#bf360c">40 GiB</text>

  <rect x="411" y="450" width="100" height="68" rx="6" fill="url(#gpuGrad)" stroke="#e65100" stroke-width="1.2"/>
  <text x="461" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">GPU 3</text>
  <text x="461" y="495" text-anchor="middle" font-size="13" fill="#bf360c">40 GiB</text>

  <!-- Worker 1 workloads -->
  <rect x="65" y="538" width="210" height="36" rx="6" fill="white" stroke="#d93025" stroke-width="1"/>
  <text x="170" y="561" text-anchor="middle" font-size="14" fill="#c5221f">Training Jobs</text>

  <rect x="290" y="538" width="210" height="36" rx="6" fill="white" stroke="#d93025" stroke-width="1"/>
  <text x="395" y="561" text-anchor="middle" font-size="14" fill="#c5221f">MIG Workloads</text>

  <text x="65" y="605" font-size="13" fill="#80868b">Namespace: training-jobs</text>

  <!-- Kueue labels -->
  <rect x="65" y="620" width="145" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="137" y="638" text-anchor="middle" font-size="12" fill="#f57f17">a100-cluster-queue</text>

  <rect x="220" y="620" width="145" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="292" y="638" text-anchor="middle" font-size="12" fill="#f57f17">mig-cluster-queue</text>

  <rect x="375" y="620" width="130" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="440" y="638" text-anchor="middle" font-size="12" fill="#f57f17">a100-gpu flavor</text>

  <!-- Worker 2 -->
  <rect x="570" y="310" width="470" height="395" rx="10" fill="url(#w2Grad)" stroke="#0d652d" stroke-width="1.5"/>
  <text x="595" y="340" font-weight="bold" font-size="17" fill="#0d652d">worker-2 (T4 Pool)</text>
  <text x="595" y="362" font-size="14" fill="#5f6368">16 vCPU &#x2022; 64 GiB RAM &#x2022; 100 GiB disk &#x2022; RHCOS 9.6</text>
  <text x="595" y="384" font-size="14" fill="#5f6368">Label: run.ai/simulated-gpu-node-pool=t4-pool</text>
  <text x="595" y="406" font-size="14" fill="#5f6368">Taint: nvidia.com/gpu=present:NoSchedule</text>

  <!-- T4 GPUs -->
  <text x="595" y="436" font-size="15" font-weight="bold" fill="#2e7d32">2x NVIDIA T4 (fake)</text>

  <rect x="595" y="450" width="170" height="68" rx="6" fill="url(#gpuGrad)" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="680" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">GPU 0</text>
  <text x="680" y="495" text-anchor="middle" font-size="13" fill="#1b5e20">16 GiB</text>

  <rect x="780" y="450" width="170" height="68" rx="6" fill="url(#gpuGrad)" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="865" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">GPU 1</text>
  <text x="865" y="495" text-anchor="middle" font-size="13" fill="#1b5e20">16 GiB</text>

  <!-- Worker 2 workloads -->
  <rect x="595" y="538" width="210" height="36" rx="6" fill="white" stroke="#0d652d" stroke-width="1"/>
  <text x="700" y="561" text-anchor="middle" font-size="14" fill="#0d652d">Inference Deployments</text>

  <text x="595" y="605" font-size="13" fill="#80868b">Namespace: inference-apps</text>

  <!-- Kueue labels -->
  <rect x="595" y="620" width="140" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="665" y="638" text-anchor="middle" font-size="12" fill="#f57f17">t4-cluster-queue</text>

  <rect x="745" y="620" width="120" height="26" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="805" y="638" text-anchor="middle" font-size="12" fill="#f57f17">t4-gpu flavor</text>
</svg>
