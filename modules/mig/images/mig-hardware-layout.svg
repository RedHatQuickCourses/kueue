<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="computeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#eeeeee"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="28" font-weight="bold" fill="#202124">A100 GPU Hardware Layout</text>
  <text x="550" y="66" text-anchor="middle" font-size="18" fill="#5f6368">Raw silicon before MIG partitioning: 7 compute slices + 8 memory slices</text>

  <!-- GPU outer border -->
  <rect x="60" y="90" width="980" height="400" rx="16" fill="url(#gpuGrad)" stroke="#616161" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="126" font-size="20" font-weight="bold" fill="#424242">NVIDIA A100-SXM4-40GB</text>
  <text x="100" y="150" font-size="15" fill="#757575">Unpartitioned -- all resources available as a single device</text>

  <!-- Compute Slices Section -->
  <text x="100" y="194" font-size="18" font-weight="bold" fill="#2e7d32">Compute Slices (7 total)</text>
  <text x="100" y="216" font-size="14" fill="#5f6368">Each slice contains ~14 Streaming Multiprocessors (SMs)</text>

  <!-- 7 Compute Slice boxes -->
  <rect x="100" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 1</text>
  <text x="160" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <rect x="230" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 2</text>
  <text x="290" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <rect x="360" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 3</text>
  <text x="420" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <rect x="490" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 4</text>
  <text x="550" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <rect x="620" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 5</text>
  <text x="680" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <rect x="750" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 6</text>
  <text x="810" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <rect x="880" y="230" width="120" height="80" rx="8" fill="url(#computeGrad)" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="940" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#1b5e20">Slice 7</text>
  <text x="940" y="290" text-anchor="middle" font-size="13" fill="#388e3c">~14 SMs</text>

  <!-- Memory Slices Section -->
  <text x="100" y="348" font-size="18" font-weight="bold" fill="#1565c0">Memory Slices (8 total)</text>
  <text x="100" y="370" font-size="14" fill="#5f6368">Each slice provides 5 GiB of HBM2e VRAM with dedicated memory bandwidth</text>

  <!-- 8 Memory Slice boxes -->
  <rect x="100" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="152" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M1</text>
  <text x="152" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="214" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="266" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M2</text>
  <text x="266" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="328" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M3</text>
  <text x="380" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="442" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="494" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M4</text>
  <text x="494" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="556" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="608" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M5</text>
  <text x="608" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="670" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="722" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M6</text>
  <text x="722" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="784" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="836" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M7</text>
  <text x="836" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <rect x="898" y="384" width="104" height="80" rx="8" fill="url(#memGrad)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="950" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">M8</text>
  <text x="950" y="444" text-anchor="middle" font-size="13" fill="#1565c0">5 GiB</text>

  <!-- Asymmetry callout -->
  <text x="550" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Key asymmetry: 7 compute slices but 8 memory slices -- this is why some MIG profiles offer extra memory</text>
</svg>
