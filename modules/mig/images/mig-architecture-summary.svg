<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="migGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="wholeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="migSlice1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
    <linearGradient id="migSlice2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#ef5350"/>
    </linearGradient>
    <linearGradient id="migSlice3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ab47bc"/>
    </linearGradient>
    <linearGradient id="wholeGpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="cqMig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
    <linearGradient id="cqA100" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="lqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#6a1b9a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="650" y="42" text-anchor="middle" font-size="32" font-weight="bold" fill="#202124">MIG + Kueue Architecture on worker-1</text>
  <text x="650" y="74" text-anchor="middle" font-size="20" fill="#5f6368">GPU 0 is MIG-partitioned into 3 instances; GPUs 1-3 remain as whole devices</text>

  <!-- Node outer border -->
  <rect x="30" y="100" width="1240" height="800" rx="16" fill="url(#nodeGrad)" stroke="#616161" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="#424242">worker-1 (A100 node)</text>

  <!-- ========== LEFT: GPU 0 MIG-partitioned ========== -->
  <rect x="60" y="165" width="580" height="195" rx="12" fill="url(#migGrad)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b5e20">GPU 0 (MIG-partitioned)</text>

  <!-- 3g.20gb slice -->
  <rect x="80" y="218" width="200" height="85" rx="8" fill="url(#migSlice1)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="180" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">3g.20gb</text>
  <text x="180" y="282" text-anchor="middle" font-size="17" fill="#fff">3 slices, 20 GiB</text>

  <!-- 2g.10gb slice -->
  <rect x="300" y="218" width="160" height="85" rx="8" fill="url(#migSlice2)" stroke="#c62828" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">2g.10gb</text>
  <text x="380" y="282" text-anchor="middle" font-size="17" fill="#fff">2 slices, 10 GiB</text>

  <!-- 1g.5gb slice -->
  <rect x="480" y="218" width="140" height="85" rx="8" fill="url(#migSlice3)" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="550" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">1g.5gb</text>
  <text x="550" y="282" text-anchor="middle" font-size="17" fill="#fff">1 slice, 5 GiB</text>

  <!-- MIG resource labels — stacked vertically below GPU 0 box -->
  <rect x="80" y="380" width="250" height="40" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="205" y="407" text-anchor="middle" font-size="16" font-weight="600" fill="#2e7d32">nvidia.com/mig-3g.20gb</text>
  <text x="205" y="440" text-anchor="middle" font-size="16" fill="#616161">quota: 1</text>

  <rect x="350" y="380" width="250" height="40" rx="6" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="475" y="407" text-anchor="middle" font-size="16" font-weight="600" fill="#c62828">nvidia.com/mig-2g.10gb</text>
  <text x="475" y="440" text-anchor="middle" font-size="16" fill="#616161">quota: 1</text>

  <!-- Third label also left-aligned, no overlap with right side -->
  <rect x="80" y="456" width="250" height="40" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="205" y="483" text-anchor="middle" font-size="16" font-weight="600" fill="#6a1b9a">nvidia.com/mig-1g.5gb</text>
  <text x="205" y="516" text-anchor="middle" font-size="16" fill="#616161">quota: 1</text>

  <!-- ========== RIGHT: GPUs 1-3 whole ========== -->
  <rect x="680" y="165" width="560" height="195" rx="12" fill="url(#wholeGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="#0d47a1">GPUs 1-3 (whole devices)</text>

  <!-- Three whole GPU boxes -->
  <rect x="710" y="218" width="150" height="85" rx="8" fill="url(#wholeGpu)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="785" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">GPU 1</text>
  <text x="785" y="282" text-anchor="middle" font-size="17" fill="#fff">40 GiB</text>

  <rect x="880" y="218" width="150" height="85" rx="8" fill="url(#wholeGpu)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="955" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">GPU 2</text>
  <text x="955" y="282" text-anchor="middle" font-size="17" fill="#fff">40 GiB</text>

  <rect x="1050" y="218" width="150" height="85" rx="8" fill="url(#wholeGpu)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1125" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">GPU 3</text>
  <text x="1125" y="282" text-anchor="middle" font-size="17" fill="#fff">40 GiB</text>

  <!-- Whole GPU resource label -->
  <rect x="810" y="380" width="300" height="40" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="960" y="407" text-anchor="middle" font-size="17" font-weight="600" fill="#0d47a1">nvidia.com/gpu: 3</text>
  <text x="960" y="440" text-anchor="middle" font-size="16" fill="#616161">quota: 3</text>

  <!-- ========== Arrows from resources to ClusterQueues ========== -->
  <line x1="350" y1="520" x2="350" y2="555" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="960" y1="450" x2="960" y2="555" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ========== ClusterQueue row ========== -->
  <!-- MIG ClusterQueue -->
  <rect x="100" y="565" width="500" height="85" rx="12" fill="url(#cqMig)" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="602" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">mig-cluster-queue</text>
  <text x="350" y="632" text-anchor="middle" font-size="17" fill="#795548">flavor: a100-mig   |   preemption: LowerPriority</text>

  <!-- A100 ClusterQueue -->
  <rect x="710" y="565" width="500" height="85" rx="12" fill="url(#cqA100)" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="602" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">a100-cluster-queue</text>
  <text x="960" y="632" text-anchor="middle" font-size="17" fill="#795548">flavor: a100-gpu   |   quota: 3 GPUs</text>

  <!-- ========== Arrows from ClusterQueues to LocalQueues ========== -->
  <line x1="350" y1="655" x2="350" y2="700" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <line x1="960" y1="655" x2="960" y2="700" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- ========== LocalQueue row ========== -->
  <!-- MIG LocalQueue -->
  <rect x="100" y="710" width="500" height="85" rx="12" fill="url(#lqGrad)" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="747" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a148c">mig-training-queue</text>
  <text x="350" y="777" text-anchor="middle" font-size="17" fill="#6a1b9a">namespace: training-jobs</text>

  <!-- A100 LocalQueue -->
  <rect x="710" y="710" width="500" height="85" rx="12" fill="url(#lqGrad)" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="747" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a148c">training-queue</text>
  <text x="960" y="777" text-anchor="middle" font-size="17" fill="#6a1b9a">namespace: training-jobs</text>

  <!-- ========== Bottom summary bar ========== -->
  <rect x="60" y="820" width="1180" height="70" rx="12" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="650" y="850" text-anchor="middle" font-size="20" font-weight="bold" fill="#283593">Developers choose their queue based on workload size</text>
  <text x="650" y="876" text-anchor="middle" font-size="18" fill="#3949ab">mig-training-queue &#x2192; MIG slices (fractional GPU)     |     training-queue &#x2192; whole A100 GPUs</text>
</svg>
