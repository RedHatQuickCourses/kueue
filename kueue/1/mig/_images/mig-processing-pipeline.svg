<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="stage1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="stage3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="manualGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="autoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="28" font-weight="bold" fill="#202124">MIG Processing Pipeline</text>
  <text x="550" y="66" text-anchor="middle" font-size="18" fill="#5f6368">Three stages to partition a GPU with the fake GPU operator</text>

  <!-- ========== Stage 1 ========== -->
  <rect x="100" y="100" width="900" height="140" rx="12" fill="url(#stage1Grad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>

  <!-- Manual badge -->
  <rect x="120" y="112" width="90" height="28" rx="14" fill="url(#manualGrad)" stroke="#c62828" stroke-width="1.5"/>
  <text x="165" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">MANUAL</text>

  <!-- Stage number -->
  <circle cx="250" cy="126" r="22" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="250" y="133" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">1</text>

  <text x="285" y="132" font-size="20" font-weight="bold" fill="#0d47a1">Node Annotation</text>

  <!-- Details -->
  <text x="140" y="168" font-size="15" fill="#1565c0">You apply labels and the <tspan font-weight="bold" font-family="monospace" font-size="14">run.ai/mig.config</tspan> annotation to the node.</text>
  <text x="140" y="192" font-size="15" fill="#1565c0">This declares which MIG profiles to create on GPU 0.</text>

  <!-- Files involved -->
  <rect x="140" y="205" width="320" height="24" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="150" y="222" font-size="13" font-family="monospace" fill="#0d47a1">kueue-config/6a-mig-node-config.yaml</text>

  <!-- Arrow Stage 1 → Stage 2 -->
  <line x1="550" y1="240" x2="550" y2="280" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ========== Stage 2 ========== -->
  <rect x="100" y="290" width="900" height="140" rx="12" fill="url(#stage2Grad)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>

  <!-- Auto badge -->
  <rect x="120" y="302" width="120" height="28" rx="14" fill="url(#autoGrad)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="180" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">AUTOMATIC</text>

  <!-- Stage number -->
  <circle cx="280" cy="316" r="22" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="280" y="323" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">2</text>

  <text x="315" y="322" font-size="20" font-weight="bold" fill="#1b5e20">mig-faker DaemonSet Processing</text>

  <!-- Details -->
  <text x="140" y="358" font-size="15" fill="#2e7d32">Watches for annotation changes, validates the MIG config, and sets:</text>
  <rect x="140" y="370" width="400" height="24" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="150" y="387" font-size="13" font-family="monospace" fill="#1b5e20">nvidia.com/mig.config.state=success</text>
  <text x="550" y="387" font-size="14" fill="#2e7d32">(node label)</text>

  <rect x="140" y="400" width="400" height="24" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="150" y="417" font-size="13" font-family="monospace" fill="#1b5e20">run.ai/mig-mapping</text>
  <text x="550" y="417" font-size="14" fill="#2e7d32">(base64-encoded device UUIDs)</text>

  <!-- Arrow Stage 2 → Stage 3 -->
  <line x1="550" y1="430" x2="550" y2="470" stroke="#5f6368" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ========== Stage 3 ========== -->
  <rect x="100" y="480" width="900" height="160" rx="12" fill="url(#stage3Grad)" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>

  <!-- Manual badge -->
  <rect x="120" y="492" width="90" height="28" rx="14" fill="url(#manualGrad)" stroke="#c62828" stroke-width="1.5"/>
  <text x="165" y="511" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">MANUAL</text>

  <!-- Stage number -->
  <circle cx="250" cy="506" r="22" fill="#ef6c00" stroke="#e65100" stroke-width="1.5"/>
  <text x="250" y="513" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">3</text>

  <text x="285" y="512" font-size="20" font-weight="bold" fill="#e65100">Topology ConfigMap Update</text>

  <!-- Details -->
  <text x="140" y="548" font-size="15" fill="#e65100">The device-plugin reads GPU inventory from the topology ConfigMap,</text>
  <text x="140" y="570" font-size="15" fill="#e65100"><tspan font-weight="bold">NOT</tspan> from node annotations. You must manually update the ConfigMap to</text>
  <text x="140" y="592" font-size="15" fill="#e65100">remove GPU 0 from whole GPUs and add MIG profiles, then restart the device-plugin pod.</text>

  <!-- Files involved -->
  <rect x="140" y="605" width="350" height="24" rx="4" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="150" y="622" font-size="13" font-family="monospace" fill="#e65100">kueue-config/6b-mig-topology-update.yaml</text>

  <!-- Why callout -->
  <rect x="660" y="545" width="320" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="820" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">Why is this manual?</text>
  <text x="820" y="590" text-anchor="middle" font-size="13" fill="#795548">The fake GPU operator's device-plugin</text>
  <text x="820" y="608" text-anchor="middle" font-size="13" fill="#795548">only reads the topology ConfigMap.</text>

  <!-- Bottom note -->
  <rect x="100" y="660" width="900" height="30" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="550" y="681" text-anchor="middle" font-size="14" fill="#616161">On real NVIDIA hardware, Stages 2 and 3 are fully automatic -- the GPU Operator handles everything after node annotation.</text>
</svg>
