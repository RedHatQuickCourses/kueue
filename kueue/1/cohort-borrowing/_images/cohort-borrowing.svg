<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="cqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="lqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="flavorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#c6dafc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="28" font-weight="bold" fill="#202124">Cohort Borrowing</text>
  <text x="550" y="66" text-anchor="middle" font-size="18" fill="#5f6368">How ClusterQueues share unused GPU capacity within a cohort</text>

  <!-- ==================== Cohort boundary ==================== -->
  <rect x="60" y="90" width="980" height="510" rx="16" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="550" y="118" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">Cohort: gpu-cohort</text>

  <!-- ==================== Left side: a100-cluster-queue ==================== -->

  <!-- ClusterQueue -->
  <rect x="100" y="140" width="400" height="130" rx="10" fill="url(#cqGrad)" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">a100-cluster-queue</text>
  <text x="300" y="196" text-anchor="middle" font-size="16" fill="#33691e">Quota: 4 GPUs (A100)</text>
  <text x="300" y="220" text-anchor="middle" font-size="15" fill="#558b2f">lendingLimit: 1 GPU</text>
  <text x="300" y="244" text-anchor="middle" font-size="14" fill="#689f38">Preemption: LowerPriority</text>

  <!-- Flavor box inside CQ -->
  <rect x="140" y="280" width="320" height="56" rx="8" fill="url(#flavorGrad)" stroke="#ef6c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="306" text-anchor="middle" font-size="18" font-weight="bold" fill="#bf360c">Flavor: a100-gpu</text>
  <text x="300" y="326" text-anchor="middle" font-size="14" fill="#4e342e">nodeLabel: NVIDIA-A100-SXM4-40GB</text>

  <!-- ==================== Right side: t4-cluster-queue ==================== -->

  <!-- ClusterQueue -->
  <rect x="600" y="140" width="400" height="130" rx="10" fill="url(#cqGrad)" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">t4-cluster-queue</text>
  <text x="800" y="196" text-anchor="middle" font-size="16" fill="#33691e">Quota: 2 GPUs (T4)</text>
  <text x="800" y="220" text-anchor="middle" font-size="15" fill="#558b2f">borrowingLimit: 1 GPU</text>
  <text x="800" y="244" text-anchor="middle" font-size="14" fill="#689f38">Preemption: LowerPriority</text>

  <!-- Primary flavor -->
  <rect x="620" y="280" width="160" height="56" rx="8" fill="url(#flavorGrad)" stroke="#ef6c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#bf360c">t4-gpu</text>
  <text x="700" y="324" text-anchor="middle" font-size="13" fill="#4e342e">Primary</text>

  <!-- Fallback flavor -->
  <rect x="820" y="280" width="160" height="56" rx="8" fill="url(#flavorGrad)" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="900" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#bf360c">a100-gpu</text>
  <text x="900" y="324" text-anchor="middle" font-size="13" fill="#e65100">Fallback (borrowed)</text>

  <!-- ==================== Borrowing arrow ==================== -->
  <path d="M 500 205 C 530 205, 540 205, 570 205" stroke="#e65100" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <text x="548" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">lends 1 GPU</text>

  <!-- ==================== LocalQueues ==================== -->

  <!-- Arrow: CQ left -> LQ left -->
  <line x1="300" y1="336" x2="300" y2="385" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="276" y="366" font-size="14" fill="#5f6368" text-anchor="middle">exposes to</text>

  <!-- Arrow: CQ right -> LQ right -->
  <line x1="800" y1="336" x2="800" y2="385" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="776" y="366" font-size="14" fill="#5f6368" text-anchor="middle">exposes to</text>

  <!-- training-queue -->
  <rect x="140" y="390" width="320" height="60" rx="8" fill="url(#lqGrad)" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="418" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">training-queue</text>
  <text x="300" y="440" text-anchor="middle" font-size="15" fill="#6a1b9a">ns: training-jobs</text>

  <!-- inference-queue -->
  <rect x="640" y="390" width="320" height="60" rx="8" fill="url(#lqGrad)" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="418" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">inference-queue</text>
  <text x="800" y="440" text-anchor="middle" font-size="15" fill="#6a1b9a">ns: inference-apps</text>

  <!-- ==================== Worker Nodes ==================== -->

  <!-- Arrow: LQ left -> Node left -->
  <line x1="300" y1="450" x2="300" y2="505" stroke="#5f6368" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="276" y="484" font-size="14" fill="#5f6368" text-anchor="middle">targets</text>

  <!-- Arrow: LQ right -> Node right -->
  <line x1="800" y1="450" x2="800" y2="505" stroke="#5f6368" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="776" y="484" font-size="14" fill="#5f6368" text-anchor="middle">targets</text>

  <!-- Borrowed workload arrow: fallback flavor -> A100 node -->
  <path d="M 900 336 Q 900 420, 580 470 Q 440 490, 420 505" stroke="#e65100" stroke-width="2.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="680" y="470" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">borrowed workload</text>
  <text x="680" y="488" font-size="14" fill="#e65100" text-anchor="middle">lands on A100 node</text>

  <!-- Worker Node 1 -->
  <rect x="140" y="510" width="320" height="70" rx="8" fill="url(#nodeGrad)" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="540" text-anchor="middle" font-size="19" font-weight="600" fill="#1a237e">Worker Node 1</text>
  <text x="300" y="564" text-anchor="middle" font-size="16" fill="#3c4043">4&#xD7; NVIDIA A100-SXM4-40GB</text>

  <!-- Worker Node 2 -->
  <rect x="640" y="510" width="320" height="70" rx="8" fill="url(#nodeGrad)" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="540" text-anchor="middle" font-size="19" font-weight="600" fill="#1a237e">Worker Node 2</text>
  <text x="800" y="564" text-anchor="middle" font-size="16" fill="#3c4043">2&#xD7; NVIDIA T4</text>
</svg>
